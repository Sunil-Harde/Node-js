<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>


#cards{

    display: grid;
    grid-template-columns: 300px 300px 300px;
    justify-content: space-between;
    align-items: start;
    gap: 30px;
    padding: 10px;

}

.card{
    min-height: 400px;
    width:  300px;
    background: #000;
    color:white;
    border-radius: 20px;
    padding: 0 5px;
}

img{
    width:100%;
    height:150px;
    border-radius: 20px 20px 0 0 ;    
}

.price{
    display: flex;
    justify-content: space-between;
    
}

h1, p {
    font-size: 20px;
    margin-bottom: 10px;
}

    </style>

    </head>
    <body>

        <div id="cards">
            
        </div>

        <script src="./script.js"></script>

    </body>
</html>
